# Builds Aura Portfolio for Windows, macOS (Apple Silicon + Intel) and Linux
# and publishes a GitHub Release. The in-app updater consumes these exact
# asset names:
#
#   aura-portfolio-v<version>-<target-triple>.(zip|tar.gz)
#   aura-portfolio-v<version>-<target-triple>.(zip|tar.gz).sha256
#
# When it runs: after the CI workflow **succeeds** on `main`. It publishes only
# if the tag `v<version from Cargo.toml>` does not exist yet, so:
#   * broken code is never released (CI must be green first);
#   * a failed release is retried automatically on the next green push;
#   * pushes without a version bump are a cheap no-op.
#
# Release flow: bump `version` in Cargo.toml → push to main → CI green → done.
# Manual run: Actions → Release → "Run workflow" (builds the branch tip).
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: aura-portfolio
  # The exact commit CI verified (or the branch tip for manual runs).
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  version:
    name: Detect version bump
    # Only after a green CI run on a push to main (or a manual dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - id: detect
        name: Read version and check for an existing tag
        shell: bash
        run: |
          VERSION=$(grep -m1 -E '^version\s*=' Cargo.toml | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists, nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${TAG} detected."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-22.04 # older glibc = wider Linux compatibility
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libgl1-mesa-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          NAME="${BIN_NAME}-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" dist/
          cp README.md LICENSE dist/
          (cd dist && tar -czf "../${NAME}.tar.gz" *)
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "$env:BIN_NAME-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          if-no-files-found: error
          path: |
            *.zip
            *.tar.gz
            *.sha256

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: Aura Portfolio ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
