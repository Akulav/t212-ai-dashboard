name: Release

# Publishes a release by itself: a push to main that changes VERSION (python tools_dev/bump_version.py 1.2.0, commit,
# push) checks the versions agree, runs the tests, builds Aura Portfolio for Windows, Linux and macOS (Apple Silicon),
# wraps them in installers, creates the tag v<VERSION> and publishes the release. A version that already has its tag
# is skipped, so nothing is published twice. "Run workflow" on the Actions page does the same for the current VERSION
# (e.g. after a failed run).
#
# Assets (installed copies update themselves from the bare programs - src/updater.rs::asset_name):
#   aura-portfolio-windows-x64.exe   aura-portfolio-linux-x64   aura-portfolio-macos-arm64
#   Aura-Portfolio-Setup.exe (Inno Setup)   Aura-Portfolio-macos-arm64.dmg   SHA256SUMS.txt
#   + bridge archives for 0.2.x updaters (aura-portfolio-v<V>-<target-triple>.zip/.tar.gz + .sha256; drop after 1.1)

on:
  push:
    branches: [main]
    # (this file too: a change to how releases are made publishes the current version if it isn't out yet)
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v="$(tr -d ' \r\n' < VERSION)"
          c="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          l="$(awk '/^name = "aura-portfolio"$/ {getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)"
          echo "VERSION=$v Cargo.toml=$c Cargo.lock=$l"
          test "$v" = "$c" || { echo "::error::VERSION $v and Cargo.toml $c differ (python tools_dev/bump_version.py)"; exit 1; }
          test "$v" = "$l" || { echo "::error::VERSION $v and Cargo.lock $l differ (build once after bumping)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "::notice::v$v is already released: nothing to publish (bump VERSION for a new release)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests (${{ matrix.os }})
    needs: check
    if: needs.check.outputs.publish == 'true'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    name: Build (${{ matrix.name }})
    needs: [check, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bin: aura-portfolio.exe
            asset: aura-portfolio-windows-x64.exe
            triple: x86_64-pc-windows-msvc
          - name: linux-x64
            # (the oldest supported Ubuntu: the program then runs on older Linux systems too)
            os: ubuntu-22.04
            bin: aura-portfolio
            asset: aura-portfolio-linux-x64
            triple: x86_64-unknown-linux-gnu
          - name: macos-arm64
            # (Apple Silicon only)
            os: macos-14
            bin: aura-portfolio
            asset: aura-portfolio-macos-arm64
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the program
        run: cargo build --release --locked
      - name: Name it for the release
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
          "./target/release/${{ matrix.bin }}" --version || true
      # (the bare programs above are what installed copies update themselves from)
      - name: Windows setup wizard (Aura-Portfolio-Setup.exe, with its uninstaller)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Get-Content VERSION -Raw).Trim()
          & $iscc /Qp "/DAppVersion=$v" "/DExe=$PWD\target\release\aura-portfolio.exe" "/O$PWD\dist" installer\aura-portfolio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: macOS app in a disk image (Aura-Portfolio-macos-arm64.dmg)
        if: runner.os == 'macOS'
        run: |
          v="$(tr -d ' \r\n' < VERSION)"
          app="dmg/Aura Portfolio.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/aura-portfolio "$app/Contents/MacOS/aura-portfolio"
          cp assets/icon.icns "$app/Contents/Resources/icon.icns"
          sed "s/@VERSION@/$v/g" installer/Info.plist > "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"   # (ad hoc: no certificate; macOS still asks once)
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Aura Portfolio" -srcfolder dmg -ov -format UDZO dist/Aura-Portfolio-macos-arm64.dmg
      # Bridge for 0.2.x: its updater looks for <target-triple> archives with a .sha256 beside them. Drop after 1.1.
      - name: Bridge archive for 0.2.x updaters
        shell: bash
        run: |
          v="$(tr -d ' \r\n' < VERSION)"
          name="aura-portfolio-v$v-${{ matrix.triple }}"
          mkdir -p bridge && cp "target/release/${{ matrix.bin }}" bridge/
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd bridge && 7z a -tzip "../dist/$name.zip" "${{ matrix.bin }}" > /dev/null)
            (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          else
            tar -C bridge -czf "dist/$name.tar.gz" "${{ matrix.bin }}"
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ needs.check.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md || echo "Aura Portfolio $v" > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Download:** Windows → `Aura-Portfolio-Setup.exe` · macOS (Apple Silicon) → `Aura-Portfolio-macos-arm64.dmg` ·
          Linux → `aura-portfolio-linux-x64` (`chmod +x`, then run it: it installs itself).
          Not code-signed: on Windows click *More info → Run anyway*; on macOS right-click the app → *Open* the first time.
          Checksums: `SHA256SUMS.txt`.
          EOF
          cat notes.md
      - name: Tag and publish (the tag v<VERSION> is created on this commit)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aura Portfolio ${{ needs.check.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
