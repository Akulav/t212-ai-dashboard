# Builds Aura Portfolio for Windows x64, Linux x64 and macOS (Apple Silicon)
# and publishes a GitHub Release. The in-app updater consumes these exact
# asset names:
#
#   aura-portfolio-v<version>-<target-triple>.(zip|tar.gz)
#   aura-portfolio-v<version>-<target-triple>.(zip|tar.gz).sha256
#
# When it runs: after the CI workflow **succeeds** on `main`. It publishes only
# if the tag `v<version from Cargo.toml>` does not exist yet, so:
#   * broken code is never released (CI must be green first);
#   * a failed release is retried automatically on the next green push;
#   * pushes without a version bump are a cheap no-op.
#
# Release flow: bump `version` in Cargo.toml → push to main → CI green → done.
# Manual run: Actions → Release → "Run workflow" (builds the branch tip).
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: aura-portfolio
  # The exact commit CI verified (or the branch tip for manual runs).
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  version:
    name: Detect version bump
    # Only after a green CI run on a push to main (or a manual dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - id: detect
        name: Read version and check for an existing tag
        shell: bash
        run: |
          VERSION=$(grep -m1 -E '^version\s*=' Cargo.toml | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists, nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${TAG} detected."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `label` names installer files; it must NOT contain the target
        # triple, so the in-app updater keeps choosing the portable archive.
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            formats: nsis
            label: windows-x64
          - os: ubuntu-22.04 # older glibc = wider Linux compatibility
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            formats: deb,appimage
            label: linux-x64
          # macOS: Apple Silicon only (no Intel Mac builds).
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            formats: app,dmg
            label: macos-apple-silicon
    env:
      CARGO_PACKAGER_VERSION: 0.11.8
      # linuxdeploy (AppImage) without FUSE on CI runners.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libgl1-mesa-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          NAME="${BIN_NAME}-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" dist/
          cp README.md LICENSE dist/
          # Marker: keep all data in ./aura-data next to the binary.
          echo "Delete this file to store data in your user profile instead." > dist/portable
          (cd dist && tar -czf "../${NAME}.tar.gz" *)
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "$env:BIN_NAME-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" dist/
          Copy-Item README.md, LICENSE dist/
          # Marker: keep all data in .\aura-data next to the exe.
          "Delete this file to store data in your user profile instead." | Out-File -Encoding ascii dist/portable
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Install cargo-packager
        shell: bash
        run: |
          if ! cargo packager --version 2>/dev/null | grep -q "$CARGO_PACKAGER_VERSION"; then
            cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"
          fi

      - name: Build installers (${{ matrix.formats }})
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      - name: Collect installers
        shell: bash
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          PREFIX="${BIN_NAME}-${TAG}-${{ matrix.label }}"
          shopt -s nullglob
          for f in target/packages/*-setup.exe target/packages/*.dmg target/packages/*.deb target/packages/*.AppImage; do
            case "$f" in
              *-setup.exe) out="${PREFIX}-setup.exe" ;;
              *.dmg)       out="${PREFIX}.dmg" ;;
              *.deb)       out="${PREFIX}.deb" ;;
              *.AppImage)  out="${PREFIX}.AppImage" ;;
            esac
            cp "$f" "$out"
            if command -v sha256sum >/dev/null; then sha256sum "$out" > "$out.sha256"; else shasum -a 256 "$out" > "$out.sha256"; fi
            echo "installer: $out"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          if-no-files-found: error
          path: |
            *.zip
            *.tar.gz
            *.exe
            *.dmg
            *.deb
            *.AppImage
            *.sha256

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: Aura Portfolio ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Download

            | Platform | Installer (recommended) | Portable |
            |---|---|---|
            | Windows 10/11 | `aura-portfolio-${{ needs.version.outputs.tag }}-windows-x64-setup.exe` | `…-x86_64-pc-windows-msvc.zip` |
            | macOS Apple Silicon | `aura-portfolio-${{ needs.version.outputs.tag }}-macos-apple-silicon.dmg` | `…-aarch64-apple-darwin.tar.gz` |
            | Linux | `.deb` (Debian/Ubuntu) or `.AppImage` | `…-x86_64-unknown-linux-gnu.tar.gz` |

            Builds are not code-signed yet. Windows SmartScreen may show "More info → Run anyway". On macOS, right-click the app → Open the first time.
            Every file has a matching `.sha256` checksum.
          files: dist/*
