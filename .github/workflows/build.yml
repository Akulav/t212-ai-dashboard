# Builds, lints and tests Windows, Linux and macOS on every push and PR.
#
# Every release ships exactly one file per OS, and that file both installs and updates:
#   AuraPortfolio-setup.exe     Windows x64 (Inno Setup; asks for the folder once, updates reuse it)
#   AuraPortfolio-linux-x64     Linux x64 (asks for a folder and installs itself there)
#   AuraPortfolio-macos-arm64   macOS Apple Silicon (asks for a folder and installs itself there as an .app)
# plus SHA256SUMS.txt, which installed copies verify updates against (src/updater.rs).
#
# Releasing is automatic: bump the version (python tools_dev/bump_version.py X.Y.Z), fill in CHANGELOG.md and push to
# main. When no release v<VERSION> exists yet, the `release` job tags the commit and publishes the release.
# Pushing a tag v<VERSION> by hand works too.

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d ' \r\n' < VERSION)"
          c="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          l="$(awk '/^name = "aura-portfolio"$/ {getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)"
          echo "VERSION=$v Cargo.toml=$c Cargo.lock=$l"
          test "$v" = "$c" || { echo "::error::VERSION $v and Cargo.toml $c differ (python tools_dev/bump_version.py)"; exit 1; }
          test "$v" = "$l" || { echo "::error::VERSION $v and Cargo.lock $l differ (build once after bumping)"; exit 1; }
          python3 -m py_compile tools_dev/*.py
          echo "version=$v" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$v" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $v"
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release v$v already exists, nothing to publish."
            else
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "### Aura Portfolio $v (release: $release)" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows x64
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Setup (install + update in one file)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ needs.meta.outputs.version }}" "/DExe=$PWD\target\release\aura-portfolio.exe" installer\aura-portfolio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\AuraPortfolio-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: AuraPortfolio-setup.exe
          path: AuraPortfolio-setup.exe
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: meta
    # (the oldest supported Ubuntu: the program then runs on older Linux systems too)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: rustdoc
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build
        run: |
          cargo build --release --locked
          cp target/release/aura-portfolio AuraPortfolio-linux-x64
          chmod +x AuraPortfolio-linux-x64
          ./AuraPortfolio-linux-x64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: AuraPortfolio-linux-x64
          path: AuraPortfolio-linux-x64
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    needs: meta
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/aura-portfolio AuraPortfolio-macos-arm64
          chmod +x AuraPortfolio-macos-arm64
          codesign --force -s - AuraPortfolio-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: AuraPortfolio-macos-arm64
          path: AuraPortfolio-macos-arm64
          if-no-files-found: error

  release:
    name: Publish release
    needs: [meta, windows, linux, macos]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/v${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && chmod +x AuraPortfolio-linux-x64 AuraPortfolio-macos-arm64 \
            && sha256sum AuraPortfolio-setup.exe AuraPortfolio-linux-x64 AuraPortfolio-macos-arm64 > SHA256SUMS.txt \
            && cat SHA256SUMS.txt)
          {
            echo "## Aura Portfolio $VERSION"
            echo
            echo "_Made by **Akulav**: your portfolio, analysed by an AI that never leaves your computer._"
            echo
            awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md
            echo
            echo "One file per system. The same file installs the app and later updates it."
            echo
            echo "| System | Download | First start |"
            echo "| --- | --- | --- |"
            echo "| Windows 10/11 (x64) | [AuraPortfolio-setup.exe]($BASE/AuraPortfolio-setup.exe) | Asks where to install (no admin rights). Updates reuse that folder. SmartScreen: *More info → Run anyway*. |"
            echo "| Linux x64 | [AuraPortfolio-linux-x64]($BASE/AuraPortfolio-linux-x64) | \`chmod +x\` it and run it. It asks where to install. |"
            echo "| macOS Apple Silicon | [AuraPortfolio-macos-arm64]($BASE/AuraPortfolio-macos-arm64) | \`chmod +x\`, then right-click → Open. It asks where to install. |"
            echo
            echo "The app and everything it keeps (settings, cache, AI models, logs) live in the folder you choose."
            echo "Installed copies update themselves in one click, verified with SHA-256."
            echo
            echo "<details><summary>SHA-256 checksums</summary>"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo "</details>"
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: Aura Portfolio ${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/AuraPortfolio-setup.exe
            dist/AuraPortfolio-linux-x64
            dist/AuraPortfolio-macos-arm64
            dist/SHA256SUMS.txt
