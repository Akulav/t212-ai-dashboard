[package]
name = "aura-portfolio"
version = "1.1.0"
edition = "2024"
rust-version = "1.89" # File::try_lock (single-instance lock)
authors = ["Akulav"]
description = "A native Rust Trading212 portfolio dashboard with a fully local, zero-config AI analyst."
license = "MIT"
repository = "https://github.com/Akulav/t212-ai-dashboard"
readme = "README.md"
keywords = ["trading212", "portfolio", "llm", "llama-cpp", "egui"]
categories = ["finance", "gui"]
build = "build.rs"

[lib]
name = "aura_portfolio"
path = "src/lib.rs"

[[bin]]
name = "aura-portfolio"
path = "src/main.rs"

[features]
default = ["nvidia"]
# NVML-based VRAM telemetry. The NVML library is loaded dynamically at runtime,
# so this compiles everywhere and degrades gracefully on non-NVIDIA machines.
nvidia = ["dep:nvml-wrapper"]

[dependencies]
# --- GUI ---------------------------------------------------------------------
eframe = "0.32"
egui_plot = "0.33" # 0.33.x is the release line built against egui 0.32
egui_extras = { version = "0.32", default-features = false } # TableBuilder
egui-phosphor = "0.10" # Phosphor icon font (MIT), 0.10.x targets egui 0.32

# --- Async + networking ------------------------------------------------------
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

# --- Data --------------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
semver = "1"

# --- Errors / logging --------------------------------------------------------
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- System ------------------------------------------------------------------
parking_lot = "0.12"
directories = "6"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
nvml-wrapper = { version = "0.11", optional = true }

# --- Security ----------------------------------------------------------------
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"

# --- Archives (llama.cpp runtime) + the bundled icon --------------------------
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] } # decodes assets/icon-256.png

# --- PDF reports (Typst 0.15 as a library) -----------------------------------
typst-as-lib = { version = "0.17", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.15"
typst = "0.15"
typst-layout = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
typst-render = "0.15"

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon + version info into aura-portfolio.exe.
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2" # setsid (detached start), prctl (Linux)

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
# Keep dependencies fast in debug builds (egui is noticeably snappier), without debug info: Typst's crates are
# huge, and with full debug info the test binaries run the linker out of memory (LNK1102).
opt-level = 2
debug = false
