[package]
name = "aura-portfolio"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
authors = ["akulav"]
description = "A native Rust Trading212 portfolio dashboard with a fully local, zero-config AI analyst."
license = "MIT"
repository = "https://github.com/akulav/t212-ai-dashboard"
readme = "README.md"
keywords = ["trading212", "portfolio", "llm", "llama-cpp", "egui"]
categories = ["finance", "gui"]
build = "build.rs"

# Installers (cargo install cargo-packager --locked; cargo packager --release):
#   Windows → NSIS setup.exe   macOS → .app + .dmg   Linux → .deb + AppImage
# Build the binary first; CI passes --target per platform.
[package.metadata.packager]
product-name = "Aura Portfolio"
identifier = "com.akulav.aura-portfolio"
publisher = "akulav"
description = "Trading212 portfolio analytics with a private, local AI analyst."
homepage = "https://github.com/Akulav/t212-ai-dashboard"
category = "Finance"
copyright = "© 2026 akulav"
license-file = "LICENSE"
out-dir = "target/packages"
binaries = [{ path = "aura-portfolio", main = true }]
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/512x512.png",
    "assets/icons/icon.icns",
    "assets/icons/icon.ico",
]

[package.metadata.packager.nsis]
# Per-user install (no admin prompt) into %LOCALAPPDATA%\Programs, with
# Start-menu shortcut and uninstaller. The in-app updater can replace the exe.
installer-mode = "currentUser"
installer-icon = "assets/icons/icon.ico"

[package.metadata.packager.deb]
depends = ["libdbus-1-3", "libxkbcommon0", "libgl1"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[lib]
name = "aura_portfolio"
path = "src/lib.rs"

[[bin]]
name = "aura-portfolio"
path = "src/main.rs"

[features]
default = ["nvidia"]
# NVML-based VRAM telemetry. The NVML library is loaded dynamically at runtime,
# so this compiles everywhere and degrades gracefully on non-NVIDIA machines.
nvidia = ["dep:nvml-wrapper"]

[dependencies]
# --- GUI ---------------------------------------------------------------------
eframe = "0.32"
egui_plot = "0.33" # 0.33.x is the release line built against egui 0.32
egui-phosphor = "0.10" # Phosphor icon font (MIT), 0.10.x targets egui 0.32

# --- Async + networking ------------------------------------------------------
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

# --- Data --------------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
semver = "1"

# --- Errors / logging --------------------------------------------------------
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- System ------------------------------------------------------------------
parking_lot = "0.12"
directories = "6"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
nvml-wrapper = { version = "0.11", optional = true }

# --- Security ----------------------------------------------------------------
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"

# --- Archives + self-update --------------------------------------------------
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
self-replace = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
# Used by `cargo run --example gen_icons` to (re)generate assets/icons/.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
icns = "0.3"

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon + version info into aura-portfolio.exe.
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
# Keep dependencies fast in debug builds (egui is noticeably snappier).
opt-level = 2
